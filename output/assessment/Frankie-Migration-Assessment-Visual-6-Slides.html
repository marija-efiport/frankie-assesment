<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frankie migration assessment</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1b29;font-family:Arial}section{width:min(100vw,1600px);margin:24px auto;box-shadow:0 5px 28px #0005}svg{display:block;width:100%;height:auto}nav{position:fixed;bottom:15px;right:20px;display:flex;gap:8px;z-index:9}button{border:1px solid #88bfc0;background:#132b40;color:white;padding:10px 15px;font-size:16px;cursor:pointer}body.present section{display:none;margin:0;width:min(100vw,177.77vh)}body.present section.active{display:block}body.present{display:flex;align-items:center;justify-content:center;min-height:100vh}@media print{@page{size:landscape;margin:0}body{background:white}section,body.present section{display:block;margin:0;width:100%;box-shadow:none;break-after:page}nav{display:none}}</style><body><section><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Frankie migration assessment slide"><rect x="0" y="0" width="1600" height="900" fill="#132B40" stroke="none"/><text x="72" y="55" fill="#72D3C6" font-family="Arial,sans-serif" font-size="18" font-weight="700">FRANKIE / MIGRATION ASSESSMENT</text><text x="1405" y="55" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="18" font-weight="400">01 / 06</text><text x="72" y="150" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="52" font-weight="700">What we have. What we still need.</text><text x="72" y="201" fill="#BBD8DE" font-family="Arial,sans-serif" font-size="28" font-weight="400">Frankie migration assessment | Current state and required handover materials</text><text x="72" y="347" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="61" font-weight="700">We have a description</text><text x="72" y="424.47" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="61" font-weight="700">of the solution.</text><text x="72" y="514" fill="#BBD8DE" font-family="Arial,sans-serif" font-size="34" font-weight="400">We still need the assets and access to prove</text><text x="72" y="557.18" fill="#BBD8DE" font-family="Arial,sans-serif" font-size="34" font-weight="400">that FS can build, deploy and operate it.</text><text x="1070" y="312" fill="#72D3C6" font-family="Arial,sans-serif" font-size="19" font-weight="700">THE ASSESSMENT MUST ESTABLISH</text><text x="1070" y="378" fill="#72D3C6" font-family="Arial,sans-serif" font-size="28" font-weight="700">01</text><text x="1140" y="378" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="28" font-weight="700">What transfers</text><text x="1140" y="414" fill="#BBD8DE" font-family="Arial,sans-serif" font-size="23" font-weight="400">Applications, data and</text><text x="1140" y="443.21" fill="#BBD8DE" font-family="Arial,sans-serif" font-size="23" font-weight="400">responsibilities</text><text x="1070" y="494" fill="#72D3C6" font-family="Arial,sans-serif" font-size="28" font-weight="700">02</text><text x="1140" y="494" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="28" font-weight="700">What is missing</text><text x="1140" y="530" fill="#BBD8DE" font-family="Arial,sans-serif" font-size="23" font-weight="400">Code, databases, configuration and</text><text x="1140" y="559.21" fill="#BBD8DE" font-family="Arial,sans-serif" font-size="23" font-weight="400">access</text><text x="1070" y="610" fill="#72D3C6" font-family="Arial,sans-serif" font-size="28" font-weight="700">03</text><text x="1140" y="610" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="28" font-weight="700">What work remains</text><text x="1140" y="646" fill="#BBD8DE" font-family="Arial,sans-serif" font-size="23" font-weight="400">Changes needed to run the systems</text><text x="1140" y="675.21" fill="#BBD8DE" font-family="Arial,sans-serif" font-size="23" font-weight="400">at FS</text><line x1="72" y1="758" x2="1528" y2="758" stroke="#416274" stroke-width="2"/><text x="72" y="811" fill="#72D3C6" font-family="Arial,sans-serif" font-size="28" font-weight="700">Current position: documentation received; technical handover and migration readiness not yet verified.</text><text x="72" y="862" fill="#BBD8DE" font-family="Arial,sans-serif" font-size="15" font-weight="400">8 October 2026 | Document-based assessment. No live code, database or infrastructure audit has been performed.</text></svg></section><section><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Frankie migration assessment slide"><rect x="0" y="0" width="1600" height="900" fill="#F7F5EF" stroke="none"/><text x="72" y="55" fill="#007F82" font-family="Arial,sans-serif" font-size="18" font-weight="700">FRANKIE / MIGRATION ASSESSMENT</text><text x="1405" y="55" fill="#526574" font-family="Arial,sans-serif" font-size="18" font-weight="400">02 / 06</text><text x="72" y="150" fill="#132B40" font-family="Arial,sans-serif" font-size="52" font-weight="700">The system we are taking over</text><text x="72" y="201" fill="#526574" font-family="Arial,sans-serif" font-size="28" font-weight="400">The Dashboard and CRM rely on services beyond their own codebases</text><rect x="72" y="318" width="430" height="210" fill="#FFFFFF" stroke="#007F82"/><text x="97" y="358" fill="#007F82" font-family="Arial,sans-serif" font-size="18" font-weight="700">STAFF INTERFACE</text><text x="97" y="417" fill="#007F82" font-family="Arial,sans-serif" font-size="31" font-weight="700">Dashboard</text><text x="97" y="466" fill="#132B40" font-family="Arial,sans-serif" font-size="25" font-weight="400">Events, conversations and tickets</text><rect x="585" y="318" width="430" height="210" fill="#FFFFFF" stroke="#007F82"/><text x="610" y="358" fill="#007F82" font-family="Arial,sans-serif" font-size="18" font-weight="700">DATA AND APIS</text><text x="610" y="417" fill="#007F82" font-family="Arial,sans-serif" font-size="31" font-weight="700">CRM / backend</text><text x="610" y="466" fill="#132B40" font-family="Arial,sans-serif" font-size="25" font-weight="400">Serves Dashboard requests</text><rect x="1098" y="318" width="430" height="210" fill="#FFFFFF" stroke="#132B40"/><text x="1123" y="358" fill="#132B40" font-family="Arial,sans-serif" font-size="18" font-weight="700">LICENSED SERVICES</text><text x="1123" y="417" fill="#132B40" font-family="Arial,sans-serif" font-size="31" font-weight="700">Mindsmiths platform</text><text x="1123" y="466" fill="#132B40" font-family="Arial,sans-serif" font-size="25" font-weight="400">Agents, routing and channels</text><line x1="507" y1="416" x2="575" y2="416" stroke="#007F82" stroke-width="4"/><line x1="575" y1="416" x2="559.9210863127522" y2="423.85024598420523" stroke="#007F82" stroke-width="4"/><line x1="575" y1="416" x2="559.9210863127522" y2="408.14975401579477" stroke="#007F82" stroke-width="4"/><line x1="1020" y1="416" x2="1088" y2="416" stroke="#007F82" stroke-width="4"/><line x1="1088" y1="416" x2="1072.921086312752" y2="423.85024598420523" stroke="#007F82" stroke-width="4"/><line x1="1088" y1="416" x2="1072.921086312752" y2="408.14975401579477" stroke="#007F82" stroke-width="4"/><text x="505" y="379" fill="#007F82" font-family="Arial,sans-serif" font-size="16" font-weight="700">CRM API</text><text x="1017" y="366" fill="#007F82" font-family="Arial,sans-serif" font-size="16" font-weight="700">Platform</text><text x="1017" y="386.32" fill="#007F82" font-family="Arial,sans-serif" font-size="16" font-weight="700">services</text><text x="72" y="291" fill="#007F82" font-family="Arial,sans-serif" font-size="19" font-weight="700">WORKING HANDOVER FOCUS</text><text x="1098" y="291" fill="#132B40" font-family="Arial,sans-serif" font-size="19" font-weight="700">RETAINED UNDER LICENSE</text><text x="72" y="616" fill="#C45A24" font-family="Arial,sans-serif" font-size="30" font-weight="700">BookStack</text><text x="365" y="610" fill="#132B40" font-family="Arial,sans-serif" font-size="28" font-weight="400">Knowledge content and management. Also identified for migration in the platform document;</text><text x="365" y="645.56" fill="#132B40" font-family="Arial,sans-serif" font-size="28" font-weight="400">inclusion must be confirmed.</text><line x1="72" y1="758" x2="1528" y2="758" stroke="#C8D5D7" stroke-width="2"/><text x="72" y="811" fill="#007F82" font-family="Arial,sans-serif" font-size="28" font-weight="700">Transferring the Dashboard and CRM does not automatically create an independent system.</text><text x="72" y="862" fill="#526574" font-family="Arial,sans-serif" font-size="15" font-weight="400">Sources: Dashboard status; Platform status; Frankie Handover overview, pp. 2 and 5. Arrows show documented service dependencies.</text></svg></section><section><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Frankie migration assessment slide"><rect x="0" y="0" width="1600" height="900" fill="#F7F5EF" stroke="none"/><text x="72" y="55" fill="#007F82" font-family="Arial,sans-serif" font-size="18" font-weight="700">FRANKIE / MIGRATION ASSESSMENT</text><text x="1405" y="55" fill="#526574" font-family="Arial,sans-serif" font-size="18" font-weight="400">03 / 06</text><text x="72" y="150" fill="#132B40" font-family="Arial,sans-serif" font-size="52" font-weight="700">What the documentation tells us</text><text x="72" y="201" fill="#526574" font-family="Arial,sans-serif" font-size="28" font-weight="400">A technical starting point that still needs verification against production</text><rect x="72" y="270" width="1456" height="65" fill="#132B40" stroke="none"/><text x="92" y="310" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="27" font-weight="700">Area</text><text x="510" y="310" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="27" font-weight="700">Dashboard</text><text x="1029" y="310" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="27" font-weight="700">CRM / backend</text><rect x="72" y="335" width="1456" height="80" fill="#E4F0ED" stroke="none"/><text x="92" y="379" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="700">Application</text><text x="510" y="379" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="400">React / Redux frontend</text><text x="1029" y="379" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="400">Python / Django service</text><text x="92" y="459" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="700">Data and connections</text><text x="510" y="459" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="400">Uses the CRM API</text><text x="1029" y="459" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="400">PostgreSQL, Redis and platform</text><text x="1029" y="493.29" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="400">adapters</text><rect x="72" y="495" width="1456" height="104" fill="#E4F0ED" stroke="none"/><text x="92" y="539" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="700">Hosting and delivery</text><text x="510" y="539" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="400">FS AWS; staging and production on</text><text x="510" y="573.29" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="400">one server</text><text x="1029" y="539" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="400">Mindsmiths CI; Azure Container</text><text x="1029" y="573.29" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="400">Registry</text><text x="92" y="643" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="700">Release process</text><text x="510" y="643" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="400">Manual SSH / rsync deployment</text><text x="1029" y="643" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="400">Supplier-managed build process</text><text x="72" y="731" fill="#526574" font-family="Arial,sans-serif" font-size="24" font-weight="400">Also received: product workflows, API descriptions, a handover proposal and FS migration requirements.</text><line x1="72" y1="758" x2="1528" y2="758" stroke="#C8D5D7" stroke-width="2"/><text x="72" y="811" fill="#007F82" font-family="Arial,sans-serif" font-size="28" font-weight="700">These are documented descriptions. Production code, data and configuration still need to be checked.</text><text x="72" y="862" fill="#526574" font-family="Arial,sans-serif" font-size="15" font-weight="400">Sources: Dashboard and Platform status documents; Technical documentation; Handover overview; FS migration framework.</text></svg></section><section><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Frankie migration assessment slide"><rect x="0" y="0" width="1600" height="900" fill="#F7F5EF" stroke="none"/><text x="72" y="55" fill="#007F82" font-family="Arial,sans-serif" font-size="18" font-weight="700">FRANKIE / MIGRATION ASSESSMENT</text><text x="1405" y="55" fill="#526574" font-family="Arial,sans-serif" font-size="18" font-weight="400">04 / 06</text><text x="72" y="150" fill="#132B40" font-family="Arial,sans-serif" font-size="52" font-weight="700">What we still cannot establish</text><text x="72" y="201" fill="#526574" font-family="Arial,sans-serif" font-size="28" font-weight="400">Four questions the supplied documents cannot answer on their own</text><text x="72" y="328" fill="#C45A24" font-family="Arial,sans-serif" font-size="44" font-weight="700">01</text><text x="182" y="323" fill="#132B40" font-family="Arial,sans-serif" font-size="34" font-weight="700">Can we build it?</text><text x="182" y="383" fill="#132B40" font-family="Arial,sans-serif" font-size="29" font-weight="400">Need: repositories, production versions,</text><text x="182" y="419.83" fill="#132B40" font-family="Arial,sans-serif" font-size="29" font-weight="400">build files and access to dependencies.</text><text x="830" y="328" fill="#C45A24" font-family="Arial,sans-serif" font-size="44" font-weight="700">02</text><text x="940" y="323" fill="#132B40" font-family="Arial,sans-serif" font-size="34" font-weight="700">Can we move the data?</text><text x="940" y="383" fill="#132B40" font-family="Arial,sans-serif" font-size="29" font-weight="400">Need: schemas, database access or</text><text x="940" y="419.83" fill="#132B40" font-family="Arial,sans-serif" font-size="29" font-weight="400">copies, attachment locations and</text><text x="940" y="456.65999999999997" fill="#132B40" font-family="Arial,sans-serif" font-size="29" font-weight="400">export/restore procedures.</text><text x="72" y="546" fill="#C45A24" font-family="Arial,sans-serif" font-size="44" font-weight="700">03</text><text x="182" y="541" fill="#132B40" font-family="Arial,sans-serif" font-size="34" font-weight="700">Will it work at FS?</text><text x="182" y="601" fill="#132B40" font-family="Arial,sans-serif" font-size="29" font-weight="400">Need: deployment configuration, integration</text><text x="182" y="637.83" fill="#132B40" font-family="Arial,sans-serif" font-size="29" font-weight="400">contracts and connectivity to retained</text><text x="182" y="674.6600000000001" fill="#132B40" font-family="Arial,sans-serif" font-size="29" font-weight="400">services.</text><text x="830" y="546" fill="#C45A24" font-family="Arial,sans-serif" font-size="44" font-weight="700">04</text><text x="940" y="541" fill="#132B40" font-family="Arial,sans-serif" font-size="34" font-weight="700">Can we maintain it?</text><text x="940" y="601" fill="#132B40" font-family="Arial,sans-serif" font-size="29" font-weight="400">Need: release and recovery procedures,</text><text x="940" y="637.83" fill="#132B40" font-family="Arial,sans-serif" font-size="29" font-weight="400">monitoring, known issues and support</text><text x="940" y="674.6600000000001" fill="#132B40" font-family="Arial,sans-serif" font-size="29" font-weight="400">responsibilities.</text><line x1="72" y1="758" x2="1528" y2="758" stroke="#C8D5D7" stroke-width="2"/><text x="72" y="811" fill="#007F82" font-family="Arial,sans-serif" font-size="28" font-weight="700">Without these checks, effort, timing and operational readiness remain uncertain.</text><text x="72" y="862" fill="#526574" font-family="Arial,sans-serif" font-size="15" font-weight="400">Assessment implications of the gaps in Dashboard and Platform status and the FS migration framework. No failure is assumed.</text></svg></section><section><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Frankie migration assessment slide"><rect x="0" y="0" width="1600" height="900" fill="#F7F5EF" stroke="none"/><text x="72" y="55" fill="#007F82" font-family="Arial,sans-serif" font-size="18" font-weight="700">FRANKIE / MIGRATION ASSESSMENT</text><text x="1405" y="55" fill="#526574" font-family="Arial,sans-serif" font-size="18" font-weight="400">05 / 06</text><text x="72" y="150" fill="#132B40" font-family="Arial,sans-serif" font-size="52" font-weight="700">What we need to receive</text><text x="72" y="201" fill="#526574" font-family="Arial,sans-serif" font-size="28" font-weight="400">A concrete handover package from the suppliers, matched to an FS target</text><text x="72" y="301" fill="#007F82" font-family="Arial,sans-serif" font-size="28" font-weight="700">SAWRAFT</text><text x="72" y="341" fill="#526574" font-family="Arial,sans-serif" font-size="24" font-weight="400">Dashboard</text><text x="72" y="404" fill="#C45A24" font-family="Arial,sans-serif" font-size="25" font-weight="700">•</text><text x="99" y="406" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="400">Repository, history and production</text><text x="99" y="440.29" fill="#132B40" font-family="Arial,sans-serif" font-size="27" font-weight="400">version</text><text x="72" y="494.58000000000004" fill="#C45A24" font-family="Arial,sans
